version: "1"

services:
  - type: web
    name: msme-crm-api
    env: node
    buildCommand: npm install -g pnpm && pnpm install && pnpm --filter @msme-crm/shared-types build && pnpm --filter @msme-crm/api build && pnpm --filter @msme-crm/api prisma:generate
    startCommand: pnpm --filter @msme-crm/api prisma:migrate:deploy && pnpm --filter @msme-crm/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: msme-crm-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: msme-crm-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WHATSAPP_CREDENTIALS_KEY
        generateValue: true
      - key: COMMUNICATION_CREDENTIALS_KEY
        generateValue: true
      - key: WEB_ORIGIN
        value: "https://your-frontend-url.vercel.app" # IMPORTANT: Update this to your deployed frontend URL

  - type: redis
    name: msme-crm-redis
    ipAllowList: []

databases:
  - name: msme-crm-db
    databaseName: msme_crm
    user: crm
